<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer une annonce</title>
  <link rel="stylesheet" href="accueil.css">
  <style>
    .form-container {
      max-width: 600px;
      margin: 3rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-container h2 {
      text-align: center;
      color: #2196f3;
    }
    header h1 {
      text-align: center;
      color: #2196f3; /* Applique la même couleur que "Créer une annonce" */
    }
    form label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    form input[type="text"],
    form input[type="number"],
    form select,
    form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    form textarea { height: 120px; resize: vertical; }
    form input[type="file"] { margin-top: 10px; }
    form button { margin-top: 2rem; width: 100%; padding: 10px; background-color: #2196f3; color: white; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; }
    form button:hover { background-color: #0e75c9; }
  </style>
</head>
<body>
  <header>
    <h1>leboncoincoin</h1>
    <div class="duck">
      <img src="leboncoincoin v1 ducky.png" alt="Duck Logo" style="height: 50px;">
    </div>
  </header>

  <div class="form-container">
    <h2>Créer une nouvelle annonce</h2>
    <form id="annonceForm" action="ajouter_annonce.php" method="post" enctype="multipart/form-data">
      <label for="categorie">Catégorie :</label>
      <select id="categorie" name="categorie" required>
        <option value="">-- Choisir une catégorie --</option>
        <option value="cars">Cars</option>
        <option value="real_estate">Real Estate</option>
        <option value="electronique">Electronique</option>
        <option value="vacance">Vacance</option>
      </select>

      <!-- Section Cars -->
      <div id="section-cars" class="hidden">
        <label for="marque">Marque :</label>
        <input type="text" id="marque" name="marque">
        <label for="modele">Modèle :</label>
        <input type="text" id="modele" name="modele">
        <label for="annee">Année :</label>
        <input type="number" id="annee" name="annee">
        <label for="kilometrage">Kilométrage (km) :</label>
        <input type="number" id="kilometrage" name="kilometrage">
      </div>

      <!-- Section Real Estate (MAISON) -->
      <div id="section-real_estate" class="hidden">
        <label for="type_bien">Type de bien :</label>
        <select id="type_bien" name="type_bien">
          <option value="maison">Maison</option>
          <option value="appartement">Appartement</option>
          <option value="terrain">Terrain</option>
        </select>
        <label for="surface">Surface (m²) :</label>
        <input type="number" id="surface" name="surface">
        <label for="pieces">Nombre de pièces :</label>
        <input type="number" id="pieces" name="pieces">
      </div>

      <!-- Section Electronique -->
      <div id="section-electronique" class="hidden">
        <label for="marque_elec">Marque :</label>
        <input type="text" id="marque_elec" name="marque_elec">
        <label for="etat">État :</label>
        <select id="etat" name="etat">
          <option value="neuf">Neuf</option>
          <option value="occasion">Occasion</option>
        </select>
        <label for="garantie">Garantie :</label>
        <input type="text" id="garantie" name="garantie" placeholder="Ex : 1 an">
      </div>

      <!-- Section Vacance -->
      <div id="section-vacance" class="hidden">
        <label for="type_location">Type de location :</label>
        <select id="type_location" name="type_location">
          <option value="maison">Maison</option>
          <option value="appartement">Appartement</option>
          <option value="bungalow">Bungalow</option>
        </select>
        <label for="date_debut">Date de début :</label>
        <input type="date" id="date_debut" name="date_debut">
        <label for="date_fin">Date de fin :</label>
        <input type="date" id="date_fin" name="date_fin">
        <label for="capacite">Capacité (nombre de personnes) :</label>
        <input type="number" id="capacite" name="capacite">
      </div>

      <!-- Champs communs -->
      <label for="titre">Titre :</label>
      <input type="text" id="titre" name="titre" required>
      <label for="prix">Prix (€) :</label>
      <input type="number" id="prix" name="prix" required>
      <label for="ville">Ville :</label>
      <input type="text" id="ville" name="ville" required>
      <label for="description">Description :</label>
      <textarea id="description" name="description" required></textarea>
      <label for="image">Photo :</label>
      <input type="file" id="image" name="image" accept="image/*" required>

      <button type="submit">Publier l'annonce</button>
    </form>
  </div>

  <script>
    const categorie = document.getElementById('categorie');
    const sections = {
      cars: document.getElementById('section-cars'),
      real_estate: document.getElementById('section-real_estate'),
      electronique: document.getElementById('section-electronique'),
      vacance: document.getElementById('section-vacance')
    };

    categorie.addEventListener('change', () => {
      Object.values(sections).forEach(sec => sec.classList.add('hidden'));
      const sel = categorie.value;
      if (sections[sel]) sections[sel].classList.remove('hidden');
    });
  </script>
</body>
</html>
