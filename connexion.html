<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <style>
    /* Appliquer box-sizing à tous les éléments */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      width: 90%;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    .site-header {
      display: flex;
      justify-content: space-between; /* Aligner les éléments aux extrémités */
      align-items: center;
      margin-bottom: 20px;
    }
    .site-header img {
      height: 50px;
      flex-shrink: 0; /* Empêche le logo de rétrécir */
    }
    .site-header h1 {
      font-size: 24px;
      margin: 0;
      color: #333;
      flex-grow: 1; /* Permet au titre de prendre l'espace restant */
      text-align: left; /* Aligner le texte à gauche */
    }
    h2 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .input-container {
      position: relative;
      margin-bottom: 20px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 40px 10px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }
    input[type="submit"] {
      width: 100%;
      background-color: #5cb85c;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    input[type="submit"]:hover {
      background-color: #4cae4c;
    }
    .forgot-password {
      text-align: center;
      margin-top: 10px;
    }
    .forgot-password a {
      color: #007BFF;
      text-decoration: none;
    }
    .forgot-password a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="logo.png" alt="Logo du site">
      <h1>Nom du Site</h1>
    </header>
    <h2>Connexion</h2>
    <form action="connexion.php" method="post">
      <label for="email">Adresse e-mail :</label>
      <input type="email" id="email" name="email" placeholder="Votre adresse e-mail" required>
      
      <label for="mot_de_passe">Mot de passe :</label>
      <div class="input-container">
        <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="Votre mot de passe" required>
        <span class="toggle-password" onclick="togglePassword('mot_de_passe', this)">&#128065;</span>
      </div>
      
      <input type="submit" value="Se connecter">
    </form>
    <div class="forgot-password">
      <a href="motdepasseoublie.php">Mot de passe oublié ?</a>
    </div>
    <div class="forgot-password">
      <a href="inscription.html">Pas encore inscrit ? Créez un compte</a>
    </div>
  </div>

  <script>
    function togglePassword(fieldId, toggleIcon) {
      const inputField = document.getElementById(fieldId);
      if (inputField.type === "password") {
        inputField.type = "text";
        toggleIcon.style.opacity = 0.5;
      } else {
        inputField.type = "password";
        toggleIcon.style.opacity = 1;
      }
    }
  </script>
</body>
</html>
